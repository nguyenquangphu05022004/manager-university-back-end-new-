spring:
  datasource:
    url: jdbc:mysql://localhost:3306/manage_university_v2
    password: root
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      database: 0
      host: localhost
      port: 6379

